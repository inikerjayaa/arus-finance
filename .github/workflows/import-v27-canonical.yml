name: Import Arus Finance V27 Canonical Bundle

on:
  push:
    branches: [main]
    paths:
      - arus_finance_v27_canonical.bundle
      - .github/workflows/import-v27-canonical.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arus-v27-canonical-import
  cancel-in-progress: false

jobs:
  import-canonical-v27:
    name: Verify and stage canonical V27 source
    if: github.repository == 'inikerjayaa/arus-finance'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify uploaded bundle bytes
        shell: bash
        run: |
          set -euo pipefail
          test -f arus_finance_v27_canonical.bundle
          echo 'ba8e2242e2a758066c7ffbf7acaa0111b8c5d4dfd77aeeefd2b280f21b2f9093  arus_finance_v27_canonical.bundle' | sha256sum -c -
          git bundle verify arus_finance_v27_canonical.bundle

      - name: Import and verify canonical Git identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch ./arus_finance_v27_canonical.bundle 'refs/heads/main:refs/remotes/v27/main'
          COMMIT="$(git rev-parse refs/remotes/v27/main)"
          TREE="$(git rev-parse refs/remotes/v27/main^{tree})"
          test "$COMMIT" = 'a014ab585003845ed7625c16f6a133b011779036'
          test "$TREE" = '91faab47c15172158f4948ebd955290d24fe2de3'
          COUNT="$(git ls-tree -r --name-only refs/remotes/v27/main | wc -l | tr -d ' ')"
          test "$COUNT" = '168'
          echo "Verified canonical commit: $COMMIT"
          echo "Verified canonical tree:   $TREE"
          echo "Verified tracked files:    $COUNT"

      - name: Materialize canonical non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          git archive refs/remotes/v27/main | tar -x -C "$TMP"

          # Keep this temporary importer unchanged because the Actions token is
          # intentionally not allowed to create/update workflow files.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          mkdir -p .github/workflows
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} +
          find .github/workflows -mindepth 1 -maxdepth 1 -type f ! -name import-v27-canonical.yml -delete

          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/workflows/' \
            "$TMP/" ./

          # The canonical V27 tree has exactly two workflow files. All other
          # files must now match the canonical archive byte-for-byte.
          test "$(find "$TMP" -type f ! -path "$TMP/.github/workflows/*" | wc -l | tr -d ' ')" = '166'
          while IFS= read -r -d '' src; do
            rel="${src#"$TMP"/}"
            test -f "$rel"
            cmp -s "$src" "$rel"
          done < <(find "$TMP" -type f ! -path "$TMP/.github/workflows/*" -print0)

          rm -rf "$TMP"

      - name: Commit canonical non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'Import verified Arus Finance V27 canonical source'
          git push origin HEAD:main
