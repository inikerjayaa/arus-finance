name: V28 One-Time Dart Analyzer Autofix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v28-dart-fix.yml

permissions:
  contents: write

jobs:
  apply-dart-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Flutter
        run: python3 tool/install_pinned_flutter_ci.py --install-dir "$RUNNER_TEMP/arus-flutter-3.47.2"

      - name: Verify pinned toolchain and lock
        run: |
          bash tool/native_toolchain_preflight.sh bootstrap
          flutter pub get --enforce-lockfile

      - name: Apply only SDK-provided Dart fixes
        run: |
          set -euo pipefail
          dart fix --apply
          dart format lib

      - name: Guard scope and commit fixes
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only)"
          test -n "$CHANGED" || {
            echo 'FAIL: dart fix produced no changes.' >&2
            exit 1
          }
          BAD="$(printf '%s\n' "$CHANGED" | grep -Ev '^lib/' || true)"
          test -z "$BAD" || {
            echo 'FAIL: dart fix touched files outside lib/:' >&2
            printf '%s\n' "$BAD" >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib
          git commit -m 'Apply Dart 3.13 analyzer autofixes'
          git push origin HEAD:main
