name: V28 One-Time Dart Autofix Rollback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v28-dart-fix.yml

permissions:
  contents: write

jobs:
  rollback-autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Revert broad autofix commit exactly
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git revert --no-edit f3ef149ede38f428ace52ed5c912d8571516967f
          test -z "$(git diff --name-only)"
          git push origin HEAD:main
