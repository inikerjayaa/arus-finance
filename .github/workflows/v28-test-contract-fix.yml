name: V28 One-Time Test Contract Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v28-test-contract-fix.yml

permissions:
  contents: write

jobs:
  patch-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply exact test-contract corrections
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p=Path(path)
              text=p.read_text()
              count=text.count(old)
              if count != expected:
                  raise SystemExit(f'FAIL: {path}: expected {expected}, found {count} for {old!r}')
              p.write_text(text.replace(old,new))

          f='test/finance_invariants_test.dart'

          # Recurring rule must be created before its September due date.
          replace(f,
              "  test('recurring occurrence is generated once', () async {\n    final bank =",
              "  test('recurring occurrence is generated once', () async {\n    fakeNow = DateTime(2026, 9, 1, 9);\n    final bank =")

          # Generated Sep-8 drafts must only be explicitly posted once the repository clock reaches Sep 8.
          replace(f,
              "    expect((await repo.listAccounts()).firstWhere((a) => a.id == bank).balanceMinor, 500000);\n    await repo.postDraftTransaction(drafts.single.id);",
              "    expect((await repo.listAccounts()).firstWhere((a) => a.id == bank).balanceMinor, 500000);\n    fakeNow = DateTime(2026, 9, 8, 23);\n    await repo.postDraftTransaction(drafts.single.id);")

          # Reopening a bill before its Sep-20 due date should be UPCOMING.
          replace(f,
              "  test('deleting a bill payment reopens the bill', () async {\n    final bank =",
              "  test('deleting a bill payment reopens the bill', () async {\n    fakeNow = DateTime(2026, 9, 10, 12);\n    final bank =")
          replace(f,
              "  test('VOID bill payment reopens bill', () async {\n    final bank =",
              "  test('VOID bill payment reopens bill', () async {\n    fakeNow = DateTime(2026, 9, 10, 12);\n    final bank =")

          replace(f,
              "    expect(\n      (await repo.listAccounts()).firstWhere((a) => a.id == bank).balanceMinor,\n      500000,\n    );\n\n    await repo.postDraftTransaction(tx['id'] as String);",
              "    expect(\n      (await repo.listAccounts()).firstWhere((a) => a.id == bank).balanceMinor,\n      500000,\n    );\n\n    fakeNow = DateTime(2026, 9, 8, 23);\n    await repo.postDraftTransaction(tx['id'] as String);")

          a='test/accessibility_guidelines_test.dart'
          replace(a,
              "  testWidgets('onboarding follows core accessibility guidelines', (tester) async {\n    final handle = tester.ensureSemantics();\n    addTearDown(handle.dispose);\n\n    await tester.pumpWidget(",
              "  testWidgets('onboarding follows core accessibility guidelines', (tester) async {\n    final handle = tester.ensureSemantics();\n    try {\n      await tester.pumpWidget(")
          replace(a,
              "    await expectLater(tester, meetsGuideline(textContrastGuideline));\n  });",
              "      await expectLater(tester, meetsGuideline(textContrastGuideline));\n    } finally {\n      handle.dispose();\n    }\n  });")

          print('PASS: finance clock fixtures + semantics lifetime corrected')
          PY

      - name: Guard scope and commit
        run: |
          set -euo pipefail
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' test/accessibility_guidelines_test.dart test/finance_invariants_test.dart | sort)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/accessibility_guidelines_test.dart test/finance_invariants_test.dart
          git commit -m 'Align Flutter tests with clock and semantics contracts'
          git push origin HEAD:main
