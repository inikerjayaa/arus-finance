name: Apply Biometric Cancel Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/biometric-cancel-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Apply guarded biometric hotfix
        run: python3 tool/apply_biometric_cancel_hotfix.py
      - name: Reject whitespace errors
        run: git diff --check
      - name: Commit hotfix only
        run: |
          git config user.name 'Arus CI'
          git config user.email 'arus-ci@users.noreply.github.com'
          git add \
            lib/core/services/security_service.dart \
            lib/features/settings/lock_gate.dart \
            test/biometric_cancel_lock_gate_test.dart \
            tool/deep_mine_biometric_cancel_audit.py \
            tool/run_all_audits.sh
          git diff --cached --name-only
          git commit -m 'Fix biometric cancel retry loop'
          git push origin HEAD:main
