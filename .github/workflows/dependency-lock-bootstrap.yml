name: Arus Dependency Lock Bootstrap

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dependency-lock-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-lock-candidate:
    name: Generate and commit verified pubspec.lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require lockfile to be absent
        run: |
          test ! -f pubspec.lock || {
            echo 'FAIL: pubspec.lock is already committed; refusing to regenerate.' >&2
            exit 1
          }

      - name: Install pinned Flutter from official archive
        run: python3 tool/install_pinned_flutter_ci.py --install-dir "$RUNNER_TEMP/arus-flutter-3.47.2"

      - name: Verify pinned Flutter/Dart
        run: bash tool/native_toolchain_preflight.sh bootstrap

      - name: Resolve one dependency-lock candidate
        run: flutter pub get

      - name: Verify exact reviewed lock hash
        run: |
          ACTUAL="$(sha256sum pubspec.lock | awk '{print $1}')"
          EXPECTED='44c58018c49d91259f5e52cf181806ab2c6daf5571d424f151b3c0c4be9c8756'
          test "$ACTUAL" = "$EXPECTED" || {
            echo "FAIL: regenerated lock hash changed: $ACTUAL" >&2
            exit 1
          }
          echo "PASS: reviewed pubspec.lock hash = $ACTUAL"

      - name: Commit verified lockfile only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock
          test "$(git diff --cached --name-only)" = 'pubspec.lock'
          git commit -m 'Lock Flutter dependencies for Arus native verification'
          git push origin HEAD:main
