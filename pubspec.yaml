name: arus_finance
description: Offline-first personal finance app for Android and iOS.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.2 <3.48.0'

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqlite3: ^3.5.2
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.1.0
  local_auth: ^3.0.2
  cryptography: ^2.9.0
  crypto: ^3.0.7
  csv: ^8.0.0
  file_picker: ^12.2.0
  share_plus: ^13.3.0
  cross_file: ^0.3.5+2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
